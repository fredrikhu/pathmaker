# The app and the API must share one origin: the session cookie is SameSite=Lax and the API
# refuses a write whose Origin is not PATHMAKER_APP_ORIGIN. Serving the static build at / and
# proxying /api on the same server block is what makes that true.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pathmaker.example.com;

    # ssl_certificate / ssl_certificate_key — managed by certbot.

    root /var/www/pathmaker;
    index index.html;

    # Hashed asset filenames; the HTML entry point must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API rejects a write whose Origin is not the app's, so the header has to survive.
        proxy_set_header Origin            $http_origin;
        proxy_read_timeout 30s;
    }

    # Hash routing means every deep link is served by the same document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pathmaker.example.com;
    return 301 https://$host$request_uri;
}
